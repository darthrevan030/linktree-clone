<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Samarth Bhatia</title>
  <!-- Board -->
  <rect width="32" height="32" rx="6" fill="#0e3b2e"/>
  <!-- Copper pins: three per side, like chip U1 on the hub -->
  <g fill="#c8894a">
    <rect x="5" y="9" width="5" height="2.4" rx="0.6"/>
    <rect x="5" y="14.8" width="5" height="2.4" rx="0.6"/>
    <rect x="5" y="20.6" width="5" height="2.4" rx="0.6"/>
    <rect x="22" y="9" width="5" height="2.4" rx="0.6"/>
    <rect x="22" y="14.8" width="5" height="2.4" rx="0.6"/>
    <rect x="22" y="20.6" width="5" height="2.4" rx="0.6"/>
  </g>
  <!-- Epoxy package with the orientation notch -->
  <rect x="9.5" y="5.5" width="13" height="21" rx="1.6" fill="#16181b"/>
  <circle cx="16" cy="5.5" r="2.2" fill="#0e3b2e"/>
  <!-- Pin-1 marker -->
  <circle cx="12.6" cy="9.6" r="1.25" fill="#d9b36a"/>
</svg>
