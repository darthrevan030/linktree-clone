<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Samarth Bhatia</title>
  <!--
    Pixel-grid aligned: every edge sits on a multiple of 2 units, so at the
    16px tab size each shape lands on whole pixels and stays sharp instead of
    smearing. Keep that rule if you edit this file, then run `npm run favicons`.
  -->
  <!-- Board -->
  <rect width="32" height="32" rx="6" fill="#0e3b2e"/>
  <g shape-rendering="crispEdges">
    <!-- Copper pins: three per side, like chip U1 on the hub -->
    <g fill="#c8894a">
      <rect x="4" y="8" width="6" height="4"/>
      <rect x="4" y="14" width="6" height="4"/>
      <rect x="4" y="20" width="6" height="4"/>
      <rect x="22" y="8" width="6" height="4"/>
      <rect x="22" y="14" width="6" height="4"/>
      <rect x="22" y="20" width="6" height="4"/>
    </g>
    <!-- Epoxy package -->
    <rect x="10" y="4" width="12" height="24" fill="#16181b"/>
    <!-- Orientation notch -->
    <rect x="14" y="4" width="4" height="2" fill="#0e3b2e"/>
    <!-- Pin-1 marker -->
    <rect x="12" y="8" width="4" height="4" fill="#d9b36a"/>
  </g>
</svg>
